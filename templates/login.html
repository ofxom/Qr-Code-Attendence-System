<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | QR Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-card">
    <div class="brand-mark">QR</div>
    <h1>QR Attendance</h1>
    <p class="muted">Sign in to continue to your dashboard.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="form-stack">
      <label for="role">Account type</label>
      <select id="role" name="role" required>
        <option value="student">Student</option>
        <option value="faculty">Faculty</option>
      </select>
      <label for="username">Roll number or faculty username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="small center">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
    <p class="small center">Faculty? <a href="{{ url_for('register_faculty') }}">Create a faculty account</a></p>
  </main>
</body>
</html>
